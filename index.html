<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Profile</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #fff; background: #0b0f2a; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .85; z-index: 0; }
  .b1 { width: 260px; height: 260px; background: #7c3aed; top: -60px; left: -80px; }
  .b2 { width: 240px; height: 240px; background: #06b6d4; bottom: -50px; right: -70px; }
  .b3 { width: 180px; height: 180px; background: #f472b6; top: 48%; left: 55%; }

  .persp { position: relative; z-index: 1; perspective: 900px; width: 100%; max-width: 360px; }
  .card {
    position: relative; aspect-ratio: 1.586; border-radius: 24px;
    transform-style: preserve-3d; will-change: transform; cursor: grab;
    background: linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.06));
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,.32);
    box-shadow: 0 24px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .glare {
    position: absolute; inset: 0; border-radius: 24px; pointer-events: none; opacity: .5;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
  }
  .content {
    position: absolute; inset: 0; padding: 20px 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    transform: translateZ(40px);
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    width: 48px; height: 48px; flex: none; border-radius: 50%; overflow: hidden;
    display: grid; place-items: center; font-size: 20px; font-weight: 600;
    background: linear-gradient(135deg, #a78bfa, #22d3ee);
    border: 2px solid rgba(255,255,255,.6);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .handle { font-size: 13px; color: rgba(255,255,255,.72); }
  .tg { width: 26px; height: 26px; flex: none; opacity: .9; }
  .lbl { font-size: 11px; color: rgba(255,255,255,.65); }
  .big { font-size: 22px; font-weight: 600; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .val { font-size: 16px; font-weight: 600; }
  .pill { padding: 4px 12px; border-radius: 99px; font-size: 12px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }

  .chips { position: relative; z-index: 1; display: flex; gap: 10px; margin-top: 24px; width: 100%; max-width: 360px; }
  .chip {
    flex: 1; padding: 12px 14px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .15s, background .15s;
  }
  .chip:active { transform: scale(.97); background: rgba(255,255,255,.2); }
  .hint { position: relative; z-index: 1; margin-top: 14px; font-size: 12px; color: rgba(255,255,255,.6); min-height: 16px; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="persp" id="stage">
    <div class="card" id="card">
      <div class="glare" id="glare"></div>
      <div class="content">
        <div class="top">
          <div class="who">
            <div class="avatar" id="avatar">?</div>
            <div style="min-width:0">
              <div class="name" id="name">Loading…</div>
              <div class="handle" id="handle"></div>
            </div>
          </div>
          <svg class="tg" viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.1 2.7 11.5c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.5-1.4zM8.5 13.7l9.7-6.1c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4z"/></svg>
        </div>
        <div>
          <div class="lbl">User ID</div>
          <div class="big" id="uid">—</div>
        </div>
        <div class="bottom">
          <div><div class="lbl">DC ID</div><div class="val" id="dc">—</div></div>
          <div><div class="lbl">Language</div><div class="val" id="lang">—</div></div>
          <div class="pill" id="prem" hidden>Premium</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chips">
    <div class="chip" data-copy="id"><div class="lbl">Copy ID</div><div class="val" id="chipId">—</div></div>
    <div class="chip" data-copy="dc"><div class="lbl">Copy DC</div><div class="val" id="chipDc">—</div></div>
  </div>
  <div class="hint" id="hint">Touch and drag the card</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();
  try { tg?.disableVerticalSwipes?.(); } catch (e) {}

  const q = new URLSearchParams(location.search);
  const u = tg?.initDataUnsafe?.user || {
    id: 7012345678, first_name: "Demo", last_name: "User",
    username: "demo_user", language_code: "en", is_premium: true
  };
  const dc = q.get("dc") || "N/A";
  const photo = u.photo_url || q.get("photo");   // Telegram photo_url first, bot backup second

  const $ = id => document.getElementById(id);
  $("name").textContent = [u.first_name, u.last_name].filter(Boolean).join(" ");
  $("handle").textContent = u.username ? "@" + u.username : "No username";
  $("uid").textContent = String(u.id).replace(/(\d{4})(?=\d)/g, "$1 ");
  $("dc").textContent = dc === "N/A" ? "N/A" : "DC " + dc;
  $("lang").textContent = (u.language_code || "—").toUpperCase();
  $("chipId").textContent = u.id;
  $("chipDc").textContent = dc;
  if (u.is_premium) $("prem").hidden = false;

  const av = $("avatar");
  const letter = () => { av.textContent = (u.first_name || "?")[0].toUpperCase(); };
  if (photo) {
    const img = new Image();
    img.onload = () => { av.textContent = ""; av.appendChild(img); };
    img.onerror = letter;
    img.referrerPolicy = "no-referrer";
    img.src = photo;
    letter();
  } else letter();

  document.querySelectorAll(".chip").forEach(c => c.onclick = async () => {
    const v = c.dataset.copy === "id" ? u.id : dc;
    try { await navigator.clipboard.writeText(String(v)); } catch (e) {}
    tg?.HapticFeedback?.impactOccurred("light");
    $("hint").textContent = "Copied " + v;
  });

  // ---- 3D tilt ----
  const card = $("card"), glare = $("glare"), MAX = 18;
  let touching = false;

  function apply(rx, ry, gx, gy, glow) {
    card.style.transform = `rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(1.04)`;
    glare.style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%)`;
    glare.style.opacity = glow;
  }
  function tilt(e) {
    const r = card.getBoundingClientRect();
    let x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    x = Math.max(-.3, Math.min(1.3, x)); y = Math.max(-.3, Math.min(1.3, y));
    apply(-(y - .5) * 2 * MAX, (x - .5) * 2 * MAX, Math.round(x * 100), Math.round(y * 100), 1);
  }
  function reset() {
    touching = false;
    card.style.cursor = "grab";
    card.style.transition = "transform .6s cubic-bezier(.2,1.4,.4,1)";
    card.style.transform = "rotateX(0) rotateY(0) scale(1)";
    glare.style.opacity = .5;
  }
  document.addEventListener("pointerdown", e => { touching = true; card.style.transition = "transform .08s linear"; card.style.cursor = "grabbing"; tilt(e); });
  document.addEventListener("pointermove", e => { if (touching || e.pointerType === "mouse") { card.style.transition = "transform .08s linear"; tilt(e); } });
  document.addEventListener("pointerup", reset);
  document.addEventListener("pointercancel", reset);

  // ---- phone tilt (gyroscope) inside Telegram ----
  try {
    const d = tg?.DeviceOrientation;
    if (d) {
      let base = null;
      tg.onEvent("deviceOrientationChanged", () => {
        if (touching) return;
        if (!base) base = { b: d.beta, g: d.gamma };
        const clamp = v => Math.max(-MAX, Math.min(MAX, v));
        const rx = clamp(-(d.beta - base.b) * .6), ry = clamp((d.gamma - base.g) * .6);
        card.style.transition = "transform .1s linear";
        apply(rx, ry, Math.round(50 + ry * 2.5), Math.round(50 - rx * 2.5), .9);
      });
      d.start({ refresh_rate: 60 });
    }
  } catch (e) {}
</script>
</body>
</html>
